volumes:
  db_data:
services:
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
  
  frontend:
    build: ./frontend
    ports:
      - "8081:80"
      