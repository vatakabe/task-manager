apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.componentName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "task-manager-chart.labels" . | nindent 4}}
    app.kubernetes.io/component: {{ .Values.frontend.componentName }}
spec:
  selector:
    {{- include "task-manager-chart.labels" . | nindent 4}}
    app.kubernetes.io/component: {{ .Values.frontend.componentName }}
  ports:
  - port: 8081
    targetPort: 80
  type: ClusterIP
