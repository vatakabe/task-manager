apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-manager
  namespace: {{ .Values.global.namespace}}
  labels:
    {{- include "task-manager-chart.labels" . | nindent 4}}
    app.kubernetes.io/component: {{ .Values.ingress.componentName}}
spec:
  ingressClassName: {{ .Values.ingress.className}}
  rules:
     - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.componentName}}
                port:
                  number: 8081
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.componentName}}
                port:
                  number: 8000
