apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.componentName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "task-manager-chart.labels" . | nindent 4}}
    app.kubernetes.io/component: {{ .Values.backend.componentName }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-manager-chart.labels" . | nindent 6}}
      app.kubernetes.io/component: {{ .Values.backend.componentName }}
  template:
    metadata:
      labels:
        {{- include "task-manager-chart.labels" . | nindent 8}}
        app.kubernetes.io/component: {{ .Values.backend.componentName }}
    spec:
      containers:
      - name: {{ .Values.backend.componentName }}
        image: {{ .Values.backend.image }}
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
        ports:
        - containerPort: {{ .Values.containerPort }}
        env:
        - name: DB_HOST
          value: {{ .Values.database.host }}
        - name: DB_PORT
          value: {{ .Values.database.port | quote }}
        - name: DB_NAME
          value: {{ .Values.database.name }}
        - name: DB_USER
          value: {{ .Values.database.user }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.existingSecret }}
              key: {{ .Values.database.secretKey }}
