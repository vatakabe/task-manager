
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.database.componentName}}
  namespace: {{ .Values.global.namespace}}
  labels:
    {{- include "task-manager-chart.labels" . | nindent 4}}
    app.kubernetes.io/component: {{ .Values.database.componentName}}
spec:
  selector:
    matchLabels:
    {{- include "task-manager-chart.labels" . | nindent 6}}
    app.kubernetes.io/component: {{ .Values.database.componentName}}
  serviceName: {{ .Values.database.componentName | quote}} "-headless"
  replicas: 1
  template:
    metadata:
      labels:
        {{- include "task-manager-chart.labels" . | nindent 8}}
        app.kubernetes.io/component: {{ .Values.database.componentName}}
    spec:
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-volume
          mountPath: /var/lib/postgresql
        env:
          - name: POSTGRES_DB 
            value: "task_manager"
          - name: POSTGRES_USER
            value: "task_app"
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: password  

  volumeClaimTemplates:
  - metadata:
      name: postgres-volume
      namespace: task-manager
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
