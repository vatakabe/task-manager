apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.componentName}}
  namespace: {{ .Values.global.namespace}}
  labels:
    {{- include "task-manager-chart.labels" . | nindent 4}}
    app.kubernetes.io/component: {{ .Values.database.componentName}}
spec:
  selector:
    {{- include "task-manager-chart.labels" . | nindent 4}}
    app.kubernetes.io/component: {{ .Values.database.componentName}}
  ports:
  - port: {{ .Values.database.port }}
    targetPort: {{ .Values.database.port }}
    name: {{ .Values.database.componentName }}
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.componentName | quote}} "-headless"
  namespace: {{ .Values.global.namespace }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.database.componentName }}
  ports:
  - port: {{ .Values.database.port }}
    name: {{ .Values.database.componentName }}

