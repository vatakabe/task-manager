#labels
global:
  projectName: task-manager
  namespace: dev


backend:
  enabled: true
  componentName: backend
  image: bubube/task-manager-backend:0.1.0
  replicaCount: 1

frontend:
  enabled: true
  componentName: frontend
  image: bubube/task-manager-frontend:0.1.0
  replicaCount: 1

database:
  componentName: db
  host: postgres
  port: 5432
  name: task_manager
  user: task_app
  existingSecret: postgres-secret
  secretKey: password
  password: ""

ingress:
  componentName: ingress
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []


containerPort: 8000



podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80



resources:
  limits:
    cpu: 250m
    memory: 256Mi


livenessProbe:
  httpGet:
    path: /api
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

